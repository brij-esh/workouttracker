global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8081"]

  - job_name: workout-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["workout-service:8082"]

  - job_name: progress-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["progress-service:8083"]

  - job_name: nutrition-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["nutrition-service:8084"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8085"]
