<div class="cropper-backdrop" role="dialog" aria-modal="true" aria-label="Adjust profile photo">
  <div class="cropper-panel">
    <header>
      <h2>Adjust photo</h2>
      <p>Drag to reposition. Use zoom to frame your face. Starts auto-fitted to the circle.</p>
    </header>

    <div
      #stage
      class="stage"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerUp($event)"
    >
      <img
        [src]="imageUrl"
        alt="Crop preview"
        draggable="false"
        [style.transform]="imageTransform()"
        (load)="onImageLoad($event)"
      />
      <div class="mask" aria-hidden="true"></div>
    </div>

    <label class="zoom">
      <span>Zoom</span>
      <input
        type="range"
        min="1"
        max="3"
        step="0.01"
        [value]="zoom()"
        (input)="onZoomInput($event)"
      />
    </label>

    <div class="actions">
      <button type="button" class="secondary" (click)="autoFit()" [disabled]="busy()">
        Auto-fit
      </button>
      <button type="button" class="ghost" (click)="cancel.emit()" [disabled]="busy()">
        Cancel
      </button>
      <button type="button" class="primary" (click)="save()" [disabled]="busy()">
        {{ busy() ? 'Saving…' : 'Use photo' }}
      </button>
    </div>
  </div>
</div>
