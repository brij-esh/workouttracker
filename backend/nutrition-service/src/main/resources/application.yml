server:
  port: 8084

spring:
  application:
    name: nutrition-service

  datasource:
    url: jdbc:postgresql://localhost:5432/nutrition_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

logging:
  level:
    com.brijesh.workouttracker.nutrition: DEBUG
    org.hibernate.SQL: INFO

workout:
  security:
    gateway-token: ${GATEWAY_INTERNAL_TOKEN:local-dev-gateway-token}
    require-gateway-token: true
  kafka:
    enabled: ${KAFKA_ENABLED:true}
